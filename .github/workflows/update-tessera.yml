name: Update Tessera submodule

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tessera-submodule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the cookbook
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Find the latest Tessera release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api repos/Rastapopolix/tessera/releases/latest --jq .tag_name)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unexpected release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Move the submodule to the release
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git -C vendor/tessera fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          git -C vendor/tessera checkout --detach "$TAG"

      - name: Commit and push when changed
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git add vendor/tessera
          if git diff --cached --quiet; then
            echo "Already on Tessera $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Tessera to $TAG"
          git push origin "HEAD:${GITHUB_REF_NAME}"
